<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar categoría</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- Barra superior -->
    <nav class="navbar">

        <div class="container-fluid">

            <span class="navbar-brand">
                Municipalidad de Los Olivos
            </span>

            <span class="text-white">
                Administrador
            </span>

        </div>

    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- Menú lateral -->
            <aside class="col-md-2 menu-lateral">

                <a href="gestionar-expediente.html">
                    Gestionar expediente
                </a>

                <a href="buscar-expediente.html">
                    Buscar expediente
                </a>

                <a href="registrar-area.html">
                    Registrar área
                </a>

                <a href="listar-areas.html">
                    Listar áreas
                </a>

                <a href="registrar-categoria.html">
                    Registrar categoría
                </a>

                <a href="editar-categoria.html">
                    Editar categoría
                </a>

                <a href="desactivar-categoria.html">
                    Desactivar categoría
                </a>

                <a href="listar-categorias.html">
                    Listar categorías
                </a>

                <a href="listar-usuarios.html">
                    Listar usuarios
                </a>

                <a href="metricas.html">
                    Métricas
                </a>

                <a href="contacto-publicidad.html">
                    Información
                </a>

                <a href="login.html">
                    Cerrar sesión
                </a>

            </aside>


            <!-- Contenido -->
            <main class="col-md-10 contenido">

                <h2 class="titulo mb-4">
                    Editar categoría de trámite
                </h2>


                <div class="card p-4 formulario">

                    <!-- Seleccionar categoría -->
                    <div class="mb-3">

                        <label class="form-label">
                            Categoría
                        </label>

                        <select class="form-select">

                            <option>
                                Licencia de funcionamiento
                            </option>

                            <option>
                                Certificado de domicilio
                            </option>

                            <option>
                                Autorización de obra
                            </option>

                        </select>

                    </div>


                    <!-- Nombre -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="Licencia de funcionamiento">

                    </div>


                    <!-- Plazo -->
                    <div class="mb-3">

                        <label class="form-label">
                            Plazo de atención
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            value="15">

                    </div>


                    <!-- Área -->
                    <div class="mb-3">

                        <label class="form-label">
                            Área responsable
                        </label>

                        <select class="form-select">

                            <option>
                                Obras Públicas
                            </option>

                            <option>
                                Rentas
                            </option>

                            <option>
                                Desarrollo Urbano
                            </option>

                        </select>

                    </div>


                    <button class="btn btn-primary guardar">
                        Guardar cambios
                    </button>

                    <a
                        href="14-listar-categorias.html"
                        class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </main>

        </div>

    </div>

</body>

</html>
