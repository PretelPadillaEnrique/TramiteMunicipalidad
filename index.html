<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trámite Municipal</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

<h1>Sistema de Trámite Documentario</h1>

<h2>1. Iniciar sesión</h2>

<input id="usuario" placeholder="Usuario">
<input id="clave" placeholder="Contraseña">
<button onclick="login()">Ingresar</button>

<p id="mensaje"></p>

<hr>

<h2>2. Expedientes</h2>

<input id="codigo" placeholder="Código">
<input id="nombre" placeholder="Ciudadano">

<button onclick="registrar()">Registrar</button>
<button onclick="buscar()">Buscar</button>
<button onclick="detalle()">Detalle</button>
<button onclick="editar()">Editar</button>

<br><br>

<input type="file" id="archivo">
<button onclick="adjuntar()">Adjuntar</button>

<p id="expediente"></p>

<hr>

<h2>3. Áreas municipales</h2>

<input id="area" placeholder="Nombre del área">

<button onclick="registrarArea()">Registrar</button>
<button onclick="editarArea()">Editar</button>
<button onclick="desactivar()">Desactivar</button>
<button onclick="listar()">Listar</button>

<p id="resultado"></p>

<script src="script.js"></script>

</body>
</html>
