<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <!-- Permite adaptar la página a diferentes pantallas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar categoría</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- Barra superior -->
    <nav class="navbar">

        <div class="container-fluid">

            <span class="navbar-brand">
                Municipalidad de Los Olivos
            </span>

            <span class="text-white">
                Administrador
            </span>

        </div>

    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- Menú lateral -->
            <aside class="col-md-2 menu-lateral">

                <a href="02-gestionar-expediente.html">
                    Gestionar expediente
                </a>

                <a href="03-buscar-expediente.html">
                    Buscar expediente
                </a>

                <a href="07-registrar-area.html">
                    Registrar área
                </a>

                <a href="10-listar-areas.html">
                    Listar áreas
                </a>

                <a href="11-registrar-categoria.html">
                    Registrar categoría
                </a>

                <a href="12-editar-categoria.html">
                    Editar categoría
                </a>

                <a href="13-desactivar-categoria.html">
                    Desactivar categoría
                </a>

                <a href="14-listar-categorias.html">
                    Listar categorías
                </a>

                <a href="18-listar-usuarios.html">
                    Listar usuarios
                </a>

                <a href="19-metricas.html">
                    Métricas
                </a>

                <a href="20-contacto-publicidad.html">
                    Información
                </a>

                <a href="01-login.html">
                    Cerrar sesión
                </a>

            </aside>


            <!-- Contenido -->
            <main class="col-md-10 contenido">

                <h2 class="titulo mb-4">
                    Registrar categoría de trámite
                </h2>


                <div class="card p-4 formulario">

                    <!-- Nombre -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del trámite
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Ejemplo: Licencia de funcionamiento">

                    </div>


                    <!-- Plazo -->
                    <div class="mb-3">

                        <label class="form-label">
                            Plazo de atención
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            placeholder="Cantidad de días">

                    </div>


                    <!-- Área -->
                    <div class="mb-3">

                        <label class="form-label">
                            Área responsable
                        </label>

                        <select class="form-select">

                            <option>
                                Seleccione un área
                            </option>

                            <option>
                                Obras Públicas
                            </option>

                            <option>
                                Rentas
                            </option>

                            <option>
                                Desarrollo Urbano
                            </option>

                        </select>

                    </div>


                    <!-- Estado -->
                    <div class="mb-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select class="form-select">

                            <option>Activo</option>
                            <option>Inactivo</option>

                        </select>

                    </div>


                    <div>

                        <button class="btn btn-primary">
                            Registrar categoría
                        </button>

                        <a
                            href="14-listar-categorias.html"
                            class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </div>

            </main>

        </div>

    </div>

</body>

</html>
