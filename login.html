<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- Contenedor principal -->
    <div class="container">

        <!-- Fila de Bootstrap -->
        <div class="row justify-content-center mt-5">

            <!-- Columna de Bootstrap -->
            <div class="col-md-5">

                <!-- Tarjeta Bootstrap -->
                <div class="card p-4">

                    <div class="text-center">

                        <h2 class="titulo">
                            Municipalidad de Los Olivos
                        </h2>

                        <p class="text-muted">
                            Sistema de Trámite Documentario
                        </p>

                    </div>

                    <form>

                        <!-- Usuario -->
                        <div class="mb-3">

                            <label class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Ingrese su usuario">

                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Ingrese su contraseña">

                        </div>

                        <!-- Botón -->
                        <div class="d-grid">

                            <a
                                href="02-gestionar-expediente.html"
                                class="btn btn-primary">

                                Iniciar sesión

                            </a>

                        </div>

                    </form>

                    <div class="text-center mt-3">

                        <a href="20-contacto-publicidad.html">
                            Información municipal
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
