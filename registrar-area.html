<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar área</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- Barra superior -->
    <nav class="navbar">

        <div class="container-fluid">

            <span class="navbar-brand">
                Municipalidad de Los Olivos
            </span>

            <span class="text-white">
                Administrador
            </span>

        </div>

    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- Menú lateral -->
            <aside class="col-md-2 menu-lateral">

                <a href="02-gestionar-expediente.html">
                    Gestionar expediente
                </a>

                <a href="03-buscar-expediente.html">
                    Buscar expediente
                </a>

                <a href="07-registrar-area.html">
                    Registrar área
                </a>

                <a href="08-editar-area.html">
                    Editar área
                </a>

                <a href="09-desactivar-area.html">
                    Desactivar área
                </a>

                <a href="10-listar-areas.html">
                    Listar áreas
                </a>

                <a href="14-listar-categorias.html">
                    Listar categorías
                </a>

                <a href="18-listar-usuarios.html">
                    Listar usuarios
                </a>

                <a href="19-metricas.html">
                    Métricas
                </a>

                <a href="20-contacto-publicidad.html">
                    Información
                </a>

                <a href="01-login.html">
                    Cerrar sesión
                </a>

            </aside>


            <!-- Contenido -->
            <main class="col-md-10 contenido">

                <h2 class="titulo mb-4">
                    Registrar área
                </h2>

                <div class="card p-4 formulario">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del área
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Ejemplo: Obras Públicas">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea
                            class="form-control"
                            rows="4"
                            placeholder="Descripción del área"></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select class="form-select">

                            <option>Activo</option>
                            <option>Inactivo</option>

                        </select>

                    </div>


                    <div>

                        <button class="btn btn-primary">
                            Registrar área
                        </button>

                        <a
                            href="10-listar-areas.html"
                            class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </div>

            </main>

        </div>

    </div>

</body>

</html>
