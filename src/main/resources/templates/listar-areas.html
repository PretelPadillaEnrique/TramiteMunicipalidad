<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áreas registradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Administrador')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Áreas registradas</h2>
            <div class="card p-4">
                <div class="d-flex justify-content-between mb-3">
                    <h5>Lista de áreas</h5>
                    <a th:href="@{/registrar-area}" class="btn btn-primary">Nueva área</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a, iterStat : ${areas}">
                            <td th:text="${iterStat.count}"></td>
                            <td th:text="${a.nombre}"></td>
                            <td th:text="${a.descripcion}"></td>
                            <td>
                                <span th:class="'badge ' + (${a.estado == 'Activo'} ? 'estado-aprobado' : 'bg-secondary')" th:text="${a.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/editar-area(id=${a.id})}" class="btn btn-sm btn-primary">Editar</a>
                                <a th:if="${a.estado == 'Activo'}" th:href="@{/desactivar-area(id=${a.id})}" class="btn btn-sm btn-danger">Desactivar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
