<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos del expediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Usuario')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Documentos del expediente <span th:text="${expediente.folio}"></span></h2>

            <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
            <div th:if="${errorCarga}" class="alert alert-danger" th:text="${errorCarga}"></div>

            <div class="card p-4 mb-4">
                <h5>Agregar documento</h5>
                <form th:action="@{/adjuntar-documentos}" th:object="${adjunto}" method="post"
                      enctype="multipart/form-data">
                    <input type="hidden" name="idExpediente" th:value="${expediente.id}">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                        <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
                    </div>
                    <div class="mb-3">
                        <label for="archivo" class="form-label">Seleccionar archivo</label>
                        <input id="archivo" name="archivo" type="file" class="form-control"
                               accept=".pdf,.jpg,.jpeg,.png" required>
                        <div class="form-text">Formatos permitidos: PDF, JPG y PNG. Tamaño máximo: 10 MB.</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Adjuntar documento</button>
                </form>
            </div>

            <div class="card p-4">
                <h5>Documentos registrados</h5>
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Documento</th>
                        <th>Fecha de carga</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="adj, iterStat : ${adjuntos}">
                        <td th:text="${iterStat.count}"></td>
                        <td>
                            <a th:href="@{/adjuntar-documentos/archivo/{id}(id=${adj.id})}"
                               th:text="${adj.nombreArchivo}"></a>
                        </td>
                        <td th:text="${adj.fechaCarga}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <a th:href="@{/detalle-expediente(id=${expediente.id})}" class="btn btn-secondary">Regresar</a>
            </div>
        </main>
    </div>
</div>
</body>
</html>
