<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar expediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Recepción')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Buscar expediente</h2>
            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Folio</th>
                            <th>Ciudadano</th>
                            <th>DNI</th>
                            <th>Categoría</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="exp, iterStat : ${expedientes}">
                            <td th:text="${iterStat.count}"></td>
                            <td th:text="${exp.folio}"></td>
                            <td th:text="${exp.ciudadanoNombre}"></td>
                            <td th:text="${exp.ciudadanoDni}"></td>
                            <td th:text="${exp.categoria != null ? exp.categoria.nombre : '-'}"></td>
                            <td>
                                <span th:class="'badge estado-' + ${#strings.toLowerCase(exp.estado)}" th:text="${exp.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/detalle-expediente(id=${exp.id})}" class="btn btn-sm btn-primary">Ver</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
