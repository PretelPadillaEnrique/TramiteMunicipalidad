<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desactivar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Administrador')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Desactivar usuario</h2>
            <div class="card p-4">
                <p><strong>Usuario:</strong> <span th:text="${usuario.nombre}"></span></p>
                <div class="alert alert-warning">
                    El usuario será marcado como inactivo. Su información se conservará en el sistema.
                </div>
                <form th:action="@{/desactivar-usuario}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <button type="submit" class="btn btn-danger">Desactivar usuario</button>
                    <a th:href="@{/listar-usuarios}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
