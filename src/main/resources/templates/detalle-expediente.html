<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del expediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Recepción')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Detalle del expediente</h2>

            <div class="card p-4 mb-4">
                <h5>Información del expediente</h5>
                <div class="row">
                    <div class="col-md-4"><strong>Folio:</strong> <span th:text="${expediente.folio}"></span></div>
                    <div class="col-md-4"><strong>Fecha:</strong> <span th:text="${expediente.fechaRegistro}"></span></div>
                    <div class="col-md-4"><strong>Estado:</strong>
                        <span th:class="'badge estado-' + ${#strings.toLowerCase(expediente.estado)}" th:text="${expediente.estado}"></span>
                    </div>
                </div>
            </div>

            <div class="card p-4 mb-4">
                <h5>Datos del ciudadano</h5>
                <p class="mb-1"><strong>Nombre:</strong> <span th:text="${expediente.ciudadanoNombre}"></span></p>
                <p class="mb-1"><strong>DNI:</strong> <span th:text="${expediente.ciudadanoDni}"></span></p>
                <p class="mb-0"><strong>Correo:</strong> <span th:text="${expediente.ciudadanoContacto}"></span></p>
            </div>

            <div class="card p-4 mb-4">
                <h5>Datos del trámite</h5>
                <p class="mb-1"><strong>Categoría:</strong> <span th:text="${expediente.categoria != null ? expediente.categoria.nombre : '-'}"></span></p>
                <p class="mb-1"><strong>Área asignada:</strong> <span th:text="${expediente.areaActual != null ? expediente.areaActual.nombre : '-'}"></span></p>
                <p class="mb-0"><strong>Fecha límite:</strong> <span th:text="${expediente.fechaLimite}"></span></p>
            </div>

            <div class="card p-4 mb-4">
                <h5>Historial de acciones</h5>
                <p class="mb-1"><strong>Registrado por:</strong> <span th:text="${expediente.usuarioRegistro != null ? expediente.usuarioRegistro.nombre : '-'}"></span></p>
                <p class="mb-0"><strong>Último cambio por:</strong> <span th:text="${expediente.usuarioUltimoCambio != null ? expediente.usuarioUltimoCambio.nombre : '-'}"></span></p>
            </div>

            <div class="card p-4">
                <h5>Acciones</h5>
                <div class="d-flex gap-2">
                    <a th:href="@{/editar-expediente(id=${expediente.id})}" class="btn btn-primary">Editar datos</a>
                    <a th:href="@{/adjuntar-documentos(id=${expediente.id})}" class="btn btn-secondary">Documentos</a>
                    <a th:href="@{/buscar-expediente}" class="btn btn-outline-secondary">Regresar</a>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
