<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Administrador')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Registrar usuario</h2>
            <div class="card p-4 formulario">
                <form th:action="@{/registrar-usuario}" th:object="${usuario}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingrese nombre completo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo institucional</label>
                        <input type="email" th:field="*{correo}" class="form-control" placeholder="usuario@munilosolivos.gob.pe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Ingrese contraseña" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select th:field="*{rol}" class="form-select" required>
                            <option value="Administrador">Administrador</option>
                            <option value="Recepción">Recepción</option>
                            <option value="Usuario">Usuario</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Área asignada</label>
                        <select name="idArea" class="form-select" required>
                            <option value="" disabled selected>Seleccione un área</option>
                            <option th:each="a : ${areas}" th:value="${a.id}" th:text="${a.nombre}"></option>
                        </select>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary">Registrar usuario</button>
                        <a th:href="@{/listar-usuarios}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
