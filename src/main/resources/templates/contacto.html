<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Información')}"></nav>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>

        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Contacto</h2>

            <div class="card p-4 mb-4">
                <h4>Datos de contacto</h4>
                <p><strong>Dirección:</strong> Municipalidad de Los Olivos</p>
                <p><strong>Teléfono:</strong> (01) 613-8282</p>
                <p><strong>Correo:</strong> informes@munilosolivos.gob.pe</p>
                <p><strong>Horario:</strong> Lunes a viernes de 8:00 a.m. a 5:00 p.m.</p>
            </div>

            <div class="card p-4">
                <h4>Escríbenos</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar mensaje</button>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
