<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Información')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Contacto</h2>

            <div class="card p-4 mb-4">
                <h4 class="mb-3">Datos de contacto</h4>
                <p><strong>Dirección:</strong> Municipalidad de Los Olivos</p>
                <p><strong>Teléfono:</strong> (01) 613-8282</p>
                <p><strong>Correo:</strong> informes@munilosolivos.gob.pe</p>
                <p><strong>Horario de atención:</strong> Lunes a viernes de 8:00 a.m. a 5:00 p.m.</p>
            </div>

            <div class="card p-4">
                <h4 class="mb-3">Escríbenos</h4>
                <p class="text-muted">Completa el siguiente formulario y envíanos tu consulta.</p>
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingresa tu nombre completo" required>
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="asunto" class="form-label">Asunto</label>
                        <input type="text" id="asunto" name="asunto" class="form-control" placeholder="Motivo de tu consulta" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" class="form-control" rows="5" placeholder="Escribe tu consulta o mensaje" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar mensaje</button>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
