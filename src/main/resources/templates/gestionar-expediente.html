<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar expediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Recepción')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Gestión del proceso del expediente</h2>

            <div class="card p-4 mb-4">
                <h5>Registrar trámite</h5>
                <form th:action="@{/gestionar-expediente}" th:object="${expediente}" method="post">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">DNI del ciudadano</label>
                            <input type="text" th:field="*{ciudadanoDni}" class="form-control" placeholder="Ingrese DNI">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{ciudadanoNombre}" class="form-control" placeholder="Nombre">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" th:field="*{ciudadanoContacto}" class="form-control" placeholder="Correo">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Categoría</label>
                            <select name="idCategoria" class="form-select">
                                <option value="">Seleccione una categoría</option>
                                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar expediente</button>
                </form>
            </div>

            <div class="card p-4">
                <h5>Expedientes en proceso</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Folio</th>
                            <th>Ciudadano</th>
                            <th>Área</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="exp, iterStat : ${expedientes}">
                            <td th:text="${iterStat.count}"></td>
                            <td th:text="${exp.folio}"></td>
                            <td th:text="${exp.ciudadanoNombre}"></td>
                            <td th:text="${exp.areaActual != null ? exp.areaActual.nombre : '-'}"></td>
                            <td>
                                <span th:class="'badge estado-' + ${#strings.toLowerCase(exp.estado)}" th:text="${exp.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/detalle-expediente(id=${exp.id})}" class="btn btn-sm btn-primary">Ver</a>

                                <form th:if="${exp.estado == 'Pendiente'}" th:action="@{/aprobar-expediente}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${exp.id}">
                                    <button type="submit" class="btn btn-sm btn-success">Aprobar</button>
                                </form>
                                <form th:if="${exp.estado == 'Pendiente'}" th:action="@{/observar-expediente}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${exp.id}">
                                    <button type="submit" class="btn btn-sm btn-warning">Observar</button>
                                </form>
                                <form th:if="${exp.estado == 'Pendiente'}" th:action="@{/rechazar-expediente}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${exp.id}">
                                    <button type="submit" class="btn btn-sm btn-danger">Rechazar</button>
                                </form>
                                <details th:if="${exp.estado == 'Pendiente'}" class="d-inline-block align-middle">
                                    <summary class="btn btn-sm btn-outline-secondary">Reprogramar</summary>
                                    <form th:action="@{/reprogramar-expediente}" method="post" class="border rounded p-2 mt-2">
                                        <input type="hidden" name="id" th:value="${exp.id}">
                                        <div class="mb-2">
                                            <label class="form-label">Motivo</label>
                                            <input type="text" name="motivo" class="form-control form-control-sm" placeholder="Ejemplo: falta documentación" required>
                                        </div>
                                        <div class="mb-2">
                                            <label class="form-label">Nueva fecha límite</label>
                                            <input type="date" name="nuevaFecha" class="form-control form-control-sm" required>
                                        </div>
                                        <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
                                    </form>
                                </details>

                                <form th:if="${exp.estado == 'Observado'}" th:action="@{/volver-a-revision}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${exp.id}">
                                    <button type="submit" class="btn btn-sm btn-primary">Volver a revisión</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>
</body>
</html>
