<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar expediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar" th:replace="~{fragments/layout :: navbar(rol='Recepción')}"></nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 menu-lateral" th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-10 contenido">
            <h2 class="titulo mb-4">Editar datos del expediente</h2>
            <div class="card p-4 formulario">
                <form th:action="@{/editar-expediente}" th:object="${expediente}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Folio</label>
                        <input type="text" th:field="*{folio}" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del ciudadano</label>
                        <input type="text" th:field="*{ciudadanoNombre}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" th:field="*{ciudadanoDni}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" th:field="*{ciudadanoContacto}" class="form-control">
                    </div>

                    <div>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a th:href="@{/detalle-expediente(id=${expediente.id})}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
