<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar expediente</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <nav class="navbar">

        <div class="container-fluid">

            <span class="navbar-brand">
                Municipalidad de Los Olivos
            </span>

            <span class="text-white">
                Recepción
            </span>

        </div>

    </nav>

    <div class="container-fluid">

        <div class="row">

            <aside class="col-md-2 menu-lateral">

                <a href="02-gestionar-expediente.html">
                    Gestionar expediente
                </a>

                <a href="03-buscar-expediente.html">
                    Buscar expediente
                </a>

                <a href="07-registrar-area.html">
                    Registrar área
                </a>

                <a href="10-listar-areas.html">
                    Listar áreas
                </a>

                <a href="14-listar-categorias.html">
                    Listar categorías
                </a>

                <a href="18-listar-usuarios.html">
                    Listar usuarios
                </a>

                <a href="19-metricas.html">
                    Métricas
                </a>

                <a href="20-contacto-publicidad.html">
                    Información
                </a>

                <a href="01-login.html">
                    Cerrar sesión
                </a>

            </aside>

            <main class="col-md-10 contenido">

                <h2 class="titulo mb-4">
                    Editar datos del expediente
                </h2>

                <div class="card p-4 formulario">

                    <div class="mb-3">

                        <label class="form-label">
                            Folio
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="EXP-001"
                            readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del ciudadano
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="Juan Pérez">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            DNI
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="74859632">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Correo
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            value="juan@email.com">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Categoría
                        </label>

                        <select class="form-select">

                            <option>
                                Licencia de funcionamiento
                            </option>

                            <option>
                                Certificado de domicilio
                            </option>

                            <option>
                                Autorización de obra
                            </option>

                        </select>

                    </div>

                    <div>

                        <button class="btn btn-primary">
                            Guardar cambios
                        </button>

                        <a
                            href="04-detalle-expediente.html"
                            class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </div>

            </main>

        </div>

    </div>

</body>

</html>
