<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuario</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- Barra superior -->
    <nav class="navbar">

        <div class="container-fluid">

            <span class="navbar-brand">
                Municipalidad de Los Olivos
            </span>

            <span class="text-white">
                Administrador
            </span>

        </div>

    </nav>


    <div class="container-fluid">

        <div class="row">

            <!-- Menú lateral -->
            <aside class="col-md-2 menu-lateral">

                <a href="02-gestionar-expediente.html">
                    Gestionar expediente
                </a>

                <a href="03-buscar-expediente.html">
                    Buscar expediente
                </a>

                <a href="07-registrar-area.html">
                    Registrar área
                </a>

                <a href="10-listar-areas.html">
                    Listar áreas
                </a>

                <a href="11-registrar-categoria.html">
                    Registrar categoría
                </a>

                <a href="14-listar-categorias.html">
                    Listar categorías
                </a>

                <a href="15-registrar-usuario.html">
                    Registrar usuario
                </a>

                <a href="16-editar-usuario.html">
                    Editar usuario
                </a>

                <a href="17-desactivar-usuario.html">
                    Desactivar usuario
                </a>

                <a href="18-listar-usuarios.html">
                    Listar usuarios
                </a>

                <a href="19-metricas.html">
                    Métricas
                </a>

                <a href="20-contacto-publicidad.html">
                    Información
                </a>

                <a href="01-login.html">
                    Cerrar sesión
                </a>

            </aside>


            <!-- Contenido -->
            <main class="col-md-10 contenido">

                <h2 class="titulo mb-4">
                    Editar usuario
                </h2>


                <div class="card p-4 formulario">

                    <!-- Seleccionar usuario -->
                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <select class="form-select">

                            <option>
                                Carlos Ramírez
                            </option>

                            <option>
                                Ana Torres
                            </option>

                            <option>
                                Luis Pérez
                            </option>

                        </select>

                    </div>


                    <!-- Nombre -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="Carlos Ramírez">

                    </div>


                    <!-- Correo -->
                    <div class="mb-3">

                        <label class="form-label">
                            Correo institucional
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            value="carlos@munilosolivos.gob.pe">

                    </div>


                    <!-- Rol -->
                    <div class="mb-3">

                        <label class="form-label">
                            Rol
                        </label>

                        <select class="form-select">

                            <option>
                                Administrador
                            </option>

                            <option selected>
                                Recepción
                            </option>

                            <option>
                                Usuario
                            </option>

                        </select>

                    </div>


                    <!-- Área -->
                    <div class="mb-3">

                        <label class="form-label">
                            Área
                        </label>

                        <select class="form-select">

                            <option>
                                Recepción
                            </option>

                            <option>
                                Obras Públicas
                            </option>

                            <option>
                                Rentas
                            </option>

                            <option>
                                Desarrollo Urbano
                            </option>

                        </select>

                    </div>


                    <button class="btn btn-primary">
                        Guardar cambios
                    </button>

                    <a
                        href="18-listar-usuarios.html"
                        class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </main>

        </div>

    </div>

</body>

</html>
